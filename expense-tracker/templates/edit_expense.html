<h2>Edit Expense</h2>

<form method="POST">

    <input
        type="text"
        name="title"
        value="{{ expense.title }}"
    >

    <br><br>

    <input
        type="number"
        step="0.01"
        name="amount"
        value="{{ expense.amount }}"
    >

    <br><br>

    <input
        type="text"
        name="category"
        value="{{ expense.category }}"
    >

    <br><br>

    <button type="submit">
        Update
    </button>

</form>
